groups:
  - name: betterdoc-dms-security-and-slo
    rules:
      - alert: BetterDocAuditChainBroken
        expr: betterdoc_audit_chain_valid == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL: BetterDoc DMS Audit Hash Chain Verification Failed"
      - alert: BetterDocBackupOverdue
        expr: (time() - betterdoc_last_verified_backup_timestamp) > 93600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "3-2-1 Encrypted Backup Snapshot has exceeded 26h SLA"
      - alert: BetterDocHighSearchLatency
        expr: histogram_quantile(0.95, rate(betterdoc_search_duration_ms_bucket[5m])) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Full-Text Search p95 Latency exceeded 1,000 ms SLO"
      - alert: BetterDocQueueBacklog
        expr: betterdoc_horizon_pending_jobs > 500
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Ingestion/OCR/AI Horizon Queue backlog exceeds 500 jobs"
