code: defence
name: "Defence & National Security Profile"
hosting_mode_default: air_gapped_on_prem
air_gapped_enforced: true
write_down_mode: strict

branding:
  organization_name: "Air Force Command Document Registry"
  short_name: "AFZ BETTERDOC"
  primary_color: "#0F172A"
  accent_color: "#0284C7"
  banner_text_prefix: "DEFENCE NETWORK"
  locale: en

terminology:
  cabinet: "Registry Volume"
  folder: "Folio"
  document: "Signal / Record"
  unit: "Formation / Unit"
  registry_item: "Correspondence Entry"
  approver: "Commanding / Approving Officer"

security:
  mfa_required: true
  session_idle_minutes: 15
  step_up_ttl_minutes: 5
  max_failed_logins: 5
  lockout_minutes: 30
  two_person_default_rank: 2
  hsm_required: true

clearance_ladder:
  - rank: 0
    code: UNCLASSIFIED
    name: "Unclassified"
    color_hex: "#475569"
    watermark_mode: none
    two_person_required: false
    secure_print_required: false
    cloud_sync_allowed: false
    e2ee_required: false
  - rank: 1
    code: RESTRICTED
    name: "Restricted"
    color_hex: "#0284C7"
    watermark_mode: footer
    two_person_required: false
    secure_print_required: true
    cloud_sync_allowed: false
    e2ee_required: false
  - rank: 2
    code: CONFIDENTIAL
    name: "Confidential"
    color_hex: "#D97706"
    watermark_mode: diagonal
    two_person_required: true
    secure_print_required: true
    cloud_sync_allowed: false
    e2ee_required: false
  - rank: 3
    code: SECRET
    name: "Secret"
    color_hex: "#DC2626"
    watermark_mode: dynamic_anti_screenshot
    two_person_required: true
    secure_print_required: true
    cloud_sync_allowed: false
    e2ee_required: false
  - rank: 4
    code: TOP_SECRET
    name: "Top Secret"
    color_hex: "#7F1D1D"
    watermark_mode: dynamic_no_download
    two_person_required: true
    secure_print_required: true
    cloud_sync_allowed: false
    e2ee_required: true

default_compartments:
  - code: OPS
    name: "Air Operations"
    description: "Operational tasking orders, flight readiness, and mission directives."
  - code: INTEL
    name: "Signals & Intelligence"
    description: "Intelligence assessments, imagery briefings, and reconnaissance logs."
  - code: PERS
    name: "Personnel & Vetting"
    description: "Security clearance dossiers, postings, and disciplinary proceedings."
  - code: LOG
    name: "Logistics & Armament"
    description: "Fleet maintenance, spares procurement, and ordnance inventories."

features:
  correspondence_registry: true
  ap_automation: false
  zimra_e_invoicing: false
  contracts_lifecycle: true
  hr_vault: true
  cloud_sync: false
  cloud_ai: false
  two_person_strict: true
  secure_print_default: true
