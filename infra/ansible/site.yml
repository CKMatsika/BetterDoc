---
- name: Provision Air-Gapped Multi-Node BetterDoc DMS Appliance
  hosts: all
  become: true
  vars:
    betterdoc_dir: /opt/betterdoc
    betterdoc_bundle_dir: /mnt/betterdoc_usb
    betterdoc_backup_root: /var/lib/betterdoc/backups
  tasks:
    - name: Verify offline installer bundle SHA256SUMS integrity
      ansible.builtin.command:
        cmd: sha256sum -c SHA256SUMS
        chdir: "{{ betterdoc_bundle_dir }}"
      changed_when: false

    - name: Enforce air-gap default-deny outbound firewall (nftables/ufw)
      ansible.builtin.shell: |
        ufw default deny outgoing || true
        ufw allow out to 10.0.0.0/8 || true
        ufw allow out to 172.16.0.0/12 || true
        ufw allow out to 192.168.0.0/16 || true
        ufw allow 443/tcp || true
      when: betterdoc_air_gapped | default(true) | bool
      changed_when: false

    - name: Import offline BetterDoc container images into containerd / Docker
      ansible.builtin.shell: |
        for tarball in "{{ betterdoc_bundle_dir }}"/images/*.tar; do
          k3s ctr images import "$tarball" || docker load -i "$tarball"
        done
      changed_when: true

    - name: Copy preloaded Ollama models, ClamAV CVD, and Tesseract eng/sna/nde datasets
      ansible.builtin.copy:
        src: "{{ betterdoc_bundle_dir }}/models/"
        dest: "{{ betterdoc_dir }}/offline_assets/"
        mode: "0640"

    - name: Deploy k3s BetterDoc stack via Kustomize
      ansible.builtin.command:
        cmd: kubectl apply -k "{{ betterdoc_dir }}/infra/k3s/base"
      run_once: true
      when: inventory_hostname in groups['betterdoc_control']
      changed_when: true

    - name: Install nightly encrypted 3-2-1 backup and audit chain verification cron
      ansible.builtin.cron:
        name: "BetterDoc DMS 3-2-1 Backup and Audit Verify"
        hour: "2"
        minute: "0"
        job: "{{ betterdoc_dir }}/scripts/backup-321.sh >> /var/log/betterdoc-backup.log 2>&1"
        user: root
