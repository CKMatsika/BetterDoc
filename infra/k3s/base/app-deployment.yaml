apiVersion: apps/v1
kind: Deployment
metadata:
  name: betterdoc-app
  namespace: betterdoc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: betterdoc-app
  template:
    metadata:
      labels:
        app: betterdoc-app
    spec:
      containers:
        - name: app
          image: betterdoc/app:local
          ports:
            - containerPort: 80
            - containerPort: 2019
          envFrom:
            - configMapRef:
                name: betterdoc-config
            - secretRef:
                name: betterdoc-secrets
          readinessProbe:
            httpGet:
              path: /login
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: betterdoc-app
  namespace: betterdoc
spec:
  selector:
    app: betterdoc-app
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: metrics
      port: 2019
      targetPort: 2019
