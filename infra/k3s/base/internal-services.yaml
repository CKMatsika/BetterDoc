apiVersion: apps/v1
kind: Deployment
metadata:
  name: betterdoc-valkey
  namespace: betterdoc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: betterdoc-valkey
  template:
    metadata:
      labels:
        app: betterdoc-valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: betterdoc-valkey
  namespace: betterdoc
spec:
  selector:
    app: betterdoc-valkey
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: betterdoc-meilisearch
  namespace: betterdoc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: betterdoc-meilisearch
  template:
    metadata:
      labels:
        app: betterdoc-meilisearch
    spec:
      containers:
        - name: meilisearch
          image: getmeili/meilisearch:v1.12
          env:
            - name: MEILI_NO_ANALYTICS
              value: "true"
          ports:
            - containerPort: 7700
---
apiVersion: v1
kind: Service
metadata:
  name: betterdoc-meilisearch
  namespace: betterdoc
spec:
  selector:
    app: betterdoc-meilisearch
  ports:
    - port: 7700
      targetPort: 7700
---
