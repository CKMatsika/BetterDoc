global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'betterdoc-frankenphp'
    static_configs:
      - targets: ['app:2019']
  - job_name: 'betterdoc-postgres'
    static_configs:
      - targets: ['postgres:5432']
  - job_name: 'betterdoc-minio'
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ['minio:9000']
